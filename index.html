<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
    line-height: 1.6;
    background: #f5f5f5;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 { text-align: center; }

input, button {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    box-sizing: border-box;
    margin-bottom: 10px;
}

button { cursor: pointer; }

#result, #ending {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    display: none;
}

.success {
    background: #dff0d8;
    border: 1px solid #b2d8a8;
}

.error {
    background: #f2dede;
    border: 1px solid #e0b4b4;
}

.hinweisbild {
    width: 100%;
    max-width: 650px;
    margin: 15px 0;
    border: 2px solid #333;
}

.quizfrage {
    margin: 20px 0;
    padding: 12px;
    background: #f0f0f0;
    border-radius: 8px;
}

.quizfrage label {
    display: block;
    margin: 8px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>🔐 Escape Room</h1>

<p>
Gebt den gefundenen Zahlencode ein.
Bei korrekter Lösung erscheint der nächste Hinweis.
</p>

<input type="text" id="code" placeholder="Code eingeben">

<button onclick="checkCode()">Prüfen</button>

<div id="result"></div>

</div>

<script>

const codes = {

<p><strong>Nächster Hinweis:</strong><br>

</p>
`,

"864": `

"816": `

`,

"125": `

<p><strong>Nächster Hinweis:</strong><br>

</p>
`,

"144": `
<strong>Richtig!</strong><br><br>

<p>Mitten in der Nacht kehrt ihr zur Hein-Möller-Schule zurück. Das Gebäude liegt still und dunkel vor euch.</p>

<p>Als ihr näherkommt, hört ihr ein tiefes mechanisches Surren.</p>

<p>Wenn ihr herausfinden wollt, was hinter dieser Tür eingeschlossen wurde, müsst ihr den letzten Code lösen.</p>
<p><strong>Füllt das letzte Arbeitsblatt aus und gebt den Abschlusscode ein.</strong></p>
`,

"143": `

<p>Widerwillig öffnet sie sich.</p>

<p>Beantworte die vier Fragen. Je nachdem, wie viele Antworten richtig sind, erwartet dich eines von vier Enden.</p>

<div class="quizfrage">
<p><strong>Frage 1:</strong> Was hat es mit den 200.000 Euro auf sich, die Irene Richter ausgezahlt bekommen hat?</p>
<label><input type="radio" name="q1" value="0"> Irene Richter hat Geld für ein Cyborg-Forschungsprojekt bekommen.</label>

<div id="ending"></div>

};

function checkCode() {
    const code = document.getElementById("code").value.trim();
    const result = document.getElementById("result");

    if (codes[code]) {
        result.className = "success";
        result.style.display = "block";
        result.innerHTML = codes[code];
    } else {
        result.className = "error";
        result.style.display = "block";
        result.innerHTML =
            "<strong>Leider falsch.</strong><br>Versucht es noch einmal.";
    }
}

function showEnding() {
    let score = 0;

    for (let i = 1; i <= 4; i++) {
        const answer = document.querySelector('input[name="q' + i + '"]:checked');
        if (answer && answer.value === "1") {
            score++;
        }
    }

    const ending = document.getElementById("ending");
    ending.style.display = "block";
    ending.className = "success";

    if (score === 4) {
        ending.innerHTML = `
        <h2>🏆 ENDE 1 – JUSTICE: Escape the Hein-Moeller</h2>

        <img src="ende1-justice.png" class="hinweisbild">

        <p>Du rennst die Treppe hinauf. Hinter dir hallen die schweren Schritte des K.O.R.R.E.K.T.O.R. durch das Treppenhaus.</p>

        <p>Die Ausgangstür ist nur noch wenige Meter entfernt. Du wirfst dich dagegen. Nichts. Die Tür klemmt.</p>

        <p>Ein metallisches Knirschen ertönt hinter dir. Eine eiskalte Metallhand packt dich am Ärmel. Der K.O.R.R.E.K.T.O.R. hat dich eingeholt.</p>

        <p>Der Stoff deiner Jacke reißt. Für einen Moment bist du sicher, dass alles verloren ist. Dann trittst du nach hinten. Der Cyborg verliert das Gleichgewicht und stürzt polternd die Treppe hinunter.</p>

        <p>Mit letzter Kraft reißt du erneut an der Tür. Sie springt auf. Du stürzt hinaus auf den Schulhof.</p>

        <p>Da ist der Direktor. Was macht er hier mitten in der Nacht? Du ahnst, dass du ihm besser nicht begegnen solltest. Schnell versteckst du dich hinter Haus C und rufst heimlich die Polizei. Mit zitternden Händen schilderst du, was du entdeckt hast.</p>

        <p>In den folgenden Wochen werden die geheimen Labore gefunden. Die Akten kommen an die Öffentlichkeit. Die Wahrheit kommt ans Licht.</p>

        <p>Der K.O.R.R.E.K.T.O.R. wird abgeschaltet und von seinem Leid erlöst. Eines Morgens siehst du in den Nachrichten, wie die gesamte Direktion der Hein-Möller-Schule in Handschellen abgeführt wird.</p>

        <p><strong>Das Geheimnis von Haus C ist beendet.</strong></p>

        <p>Zumindest glaubst du das. Denn manchmal fragst du dich noch heute, ob wirklich alle Akten gefunden wurden. Und ob tief unter der Schule vielleicht noch weitere Türen verborgen sind.</p>
        `;
    } else if (score === 3) {
        ending.innerHTML = `
        <h2>🟠 ENDE 2 – An offer you can't refuse</h2>

        <img src="ende2-offer.png" class="hinweisbild">

        <p>Du rennst die Treppe hinauf, während die Schritte des Cyborgs immer näher kommen. Als du die letzte Stufe erreichst, siehst du vor dir die offene Tür. Mit letzter Kraft stürzt du hinaus auf den Schulhof und stolperst über den Asphalt.</p>

        <p>Hinter dir erklingt das metallische Stampfen des K.O.R.R.E.K.T.O.R. Als du dich umdrehst, steht er bereits direkt vor dir. Seine kalte Metallhand greift nach deinem Arm. Du bist sicher, dass alles vorbei ist.</p>

        <p>Doch plötzlich macht es ein trockenes <strong>Klack</strong>. Der Cyborg erstarrt mitten in der Bewegung. Sein blaues Auge flackert mehrmals auf. Dann wird es dunkel.</p>

        <p>Verwirrt blickst du dich um. Vor dem Eingang stehen der Direktor, der stellvertretende Direktor und mehrere Abteilungsleitungen. Zwei von ihnen packen den abgeschalteten Cyborg und schleifen ihn zurück in Richtung Haus C. Wenig später verschwindet er wieder dort, wo er all die Jahre verborgen war.</p>

        <p>Der Direktor tritt auf dich zu und lächelt freundlich. Zu freundlich.</p>

        <p><strong>„Du hast heute Nacht etwas gesehen, das niemand sehen sollte.“</strong></p>

        <p>Dann macht er dir ein Angebot. Ein Angebot, das du nicht ablehnen kannst. Wenn du für immer schweigst, wird man sich erkenntlich zeigen. Doch dafür gibt es eine Bedingung.</p>

        <p>Du wirst die Hein-Möller-Schule nie wieder verlassen. Ab morgen beginnst du hier deinen neuen Job.</p>

        <p>Und jedes Mal, wenn du an Haus C vorbeigehst, fragst du dich, ob der K.O.R.R.E.K.T.O.R. wirklich noch abgeschaltet ist.</p>
        `;
    } else if (score === 2) {
        ending.innerHTML = `
        <h2>💀 ENDE 3 – Hein-Möller: Release the Horror</h2>

        <img src="ende3-horror.png" class="hinweisbild">

        <p>Du stürzt die Treppen hinauf. Der Cyborg folgt dir. Seine Schritte hallen durch das Treppenhaus.</p>

        <p>Mit zitternden Händen steckst du den Schlüssel ins Schloss. Ein Klick. Die Tür springt auf. Gerade noch rechtzeitig.</p>

        <p>Du stolperst ins Freie und rennst über den Schulhof. Hinter dir erklingt Metall auf Beton. Der K.O.R.R.E.K.T.O.R. verfolgt dich.</p>

        <p>Du biegst in Richtung Herzbergepark ab. Außer Atem wirfst du dich hinter ein parkendes Auto. Dann schleichst du weiter in die Dunkelheit.</p>

        <p>Der Cyborg bleibt auf der Straße stehen. Er sucht. Langsam dreht er den Kopf nach links. Dann nach rechts. Schließlich verschwindet er zwischen den Häusern.</p>

        <p>Du atmest auf. Für einen Moment.</p>

        <p>Dann hörst du in der Ferne einen Schrei. Eine Frauenstimme. Und eine kalte mechanische Stimme:</p>

        <p><strong>„Korrektur erfolgt.“</strong></p>

        <p>Stille.</p>

        <p>Fünf Minuten später ertönt der nächste Schrei. Dann noch einer. Du hältst dir die Ohren zu.</p>

        <p>Irgendwo dort draußen ist der K.O.R.R.E.K.T.O.R. jetzt frei.</p>

        <p>Du hast dein Leben gerettet.</p>

        <p><strong>Doch ganz Lichtenberg ist in Gefahr.</strong></p>
        `;
    } else {
        ending.innerHTML = `
        <h2>💀 ENDE 4 – Hein-Möller 4ever Dark</h2>

        <img src="ende4-kiste.png" class="hinweisbild">

        <p>Du rennst. Du stürzt die Treppen hinauf. Du erreichst die zweite Tür. Doch sie ist verschlossen.</p>

        <p>Mit zitternden Fingern suchst du nach dem richtigen Schlüssel. Zu spät.</p>

        <p>Eine kalte Metallhand packt dich von hinten. Du windest dich. Du trittst. Du schreist. Doch der K.O.R.R.E.K.T.O.R. ist zu stark.</p>

        <p>Er schleift dich zurück in das Labor. Vor die große Tür K-17. Vor die Kiste.</p>

        <p>Die Kiste, in der er selbst all die Jahre gefangen war.</p>

        <p>Mit letzter Kraft versuchst du dich zu befreien. Vergeblich.</p>

        <p>Die Tür fällt zu.</p>

        <p>Dunkelheit.</p>

        <p>Stille.</p>

        <p>Niemand hört deine Schreie.</p>

        <p>Die Stunden vergehen. Der Durst wird stärker. Und irgendwo draußen hallt eine metallische Stimme durch das Labor:</p>

        <p><strong>„Fehler erkannt.“</strong></p>

        <p><strong>„Korrektur abgeschlossen.“</strong></p>
        `;
    }
}

</script>

</body>
</html>
