<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
    line-height: 1.6;
    background: #f5f5f5;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    box-sizing: border-box;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    display: none;
}

.success {
    background: #dff0d8;
    border: 1px solid #b2d8a8;
}

.error {
    background: #f2dede;
    border: 1px solid #e0b4b4;
}
</style>

</head>
<body>

<div class="container">

<h1>🔐 Escape Room</h1>

<p>
Gebt den gefundenen Zahlencode ein.
Bei korrekter Lösung erscheint der nächste Hinweis.
</p>

<input type="text" id="code" placeholder="Code eingeben">

<button onclick="checkCode()">Prüfen</button>

<div id="result"></div>

</div>

<script>

const codes = {

"826": "Das Ziel ist oft näher, als man denkt. Sucht den stillen Nachbarn dieses Ortes. Dort wartet das nächste Rätsel.",

"864": "Wo kleine weiße Bälle über den Tisch tanzen, wächst ein Baum, der an Weihnachten in vielen Häusern glänzt. Dort wartet das nächste Rätsel.",

"816": "An einem Ort nur für euch treffen sich Könige, Damen und Pferde zum Kampf auf Schwarz und Weiß. Dort wartet das nächste Rätsel.",

"125": "Vor den Hallen der Schraubendreher, Zangen und Kabel wächst die dornige Königin der Blumen. Dort findet ihr das nächste Rätsel.",

"144": "Ob Sonne, ob Regen, bei eisiger Kälte oder praller Hitze, eine wartet immer auf dem Hof auf Besuch. Setzt euch zu ihr und sucht nach dem nächsten Hinweis."

};

function checkCode() {

    const code = document.getElementById("code").value.trim();

    const result = document.getElementById("result");

    if (codes[code]) {

        result.className = "success";
        result.style.display = "block";
        result.innerHTML =
            "<strong>Richtig!</strong><br><br>" + codes[code];

    } else {

        result.className = "error";
        result.style.display = "block";
        result.innerHTML =
            "<strong>Leider falsch.</strong><br>Versucht es noch einmal.";

    }
}

</script>

</body>
</html>
